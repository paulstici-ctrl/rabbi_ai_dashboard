name: CEO prototype tests
on:
  push:
    branches:
      - feat/ceo-dashboard-prototype
    paths:
      - 'v1/**'
      - '.github/workflows/ceo-prototype-tests.yml'
  pull_request:
    paths:
      - 'v1/**'
      - '.github/workflows/ceo-prototype-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing V1 and new CEO tests
        working-directory: v1
        run: npm test
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser automation
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile routes and CEO controls
        working-directory: v1
        run: python tools/smoke.py --shots /tmp/ceo-smoke-shots
      - name: Save demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceo-demo-browser-shots
          path: /tmp/ceo-smoke-shots
          if-no-files-found: ignore
          retention-days: 7
